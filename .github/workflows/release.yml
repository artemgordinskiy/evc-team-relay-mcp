name: release

# A tag vX.Y.Z.N (upstream release X.Y.Z plus fork revision N) runs the full
# CI on the tagged commit, then publishes exactly the wheel and sdist that CI
# built and integration-tested, with SHA256SUMS, the compatibility manifest
# and a provenance attestation. The release stays a draft until the uploaded
# assets are downloaded again and match SHA256SUMS by name and hash.

on:
  push:
    tags: ["v*.*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  publish:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          expected="v$version"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::tag $TAG does not match package version $version (expected $expected)"
            exit 1
          fi
          ls dist/*"$version"-py3-none-any.whl dist/*"$version".tar.gz

      - name: Assemble release assets
        run: |
          mkdir release
          cp dist/*.whl dist/*.tar.gz release/
          cp compat/manifest.json release/compat-manifest.json
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz

      - name: Create draft release
        run: |
          {
            echo "Guarded fork of entire-vc/evc-team-relay-mcp for the homelab."
            echo
            echo "Tested in CI against the control plane and dependencies in compat-manifest.json."
            echo "Install the wheel by URL and verify it against SHA256SUMS."
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" release/* --draft --verify-tag --title "$TAG" --notes-file notes.md

      - name: Verify uploaded assets, then publish
        run: |
          mkdir check
          gh release download "$TAG" --dir check
          (cd check && sha256sum --strict -c SHA256SUMS)
          expected=$(cd release && ls | sort)
          actual=$(cd check && ls | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::uploaded asset names differ from the built ones"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          gh release edit "$TAG" --draft=false
